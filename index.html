```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DuyetID Editable</title>

<style>
body{
    margin:0;
    padding:0;
    background:#4b0082;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:90%;
    max-width:700px;
    background:white;
    border:6px solid #001f5c;
    border-radius:20px;
    padding:25px;
    text-align:center;
}

h1{
    color:#001f5c;
    margin-bottom:5px;
}

h2{
    color:#0077ff;
    margin-top:0;
}

.table-box{
    border:3px solid #001f5c;
    margin-top:20px;
    padding:20px;
    min-height:120px;
    border-radius:12px;
    background:#f5f5f5;
}

/* Ô chỉnh sửa */
.edit-area{
    margin-top:20px;
    padding:15px;
    border:2px dashed #0077ff;
    border-radius:10px;
    min-height:60px;
    outline:none;
    background:#ffffff;
    font-size:18px;
}

/* Nút kick */
.kick-btn{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:12px;
    background:#0077ff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.kick-btn:hover{
    background:#0057c2;
}
</style>
</head>

<body>

<div class="box">

    <h1>WEB DUYETID</h1>
    <h2>BABACHIOS</h2>

    <div class="table-box">
        BẢNG HIỂN THỊ
    </div>

    <!-- Chỗ chỉnh sửa chữ -->
    <div class="edit-area" contenteditable="true">
        Nhấn vào đây để sửa chữ...
    </div>

    <!-- Nút kick -->
    <button class="kick-btn" onclick="alert('Kick thành công!')">
        KICK
    </button>

</div>

</body>
</html>
```
